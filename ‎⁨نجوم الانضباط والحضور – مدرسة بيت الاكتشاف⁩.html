<meta name="claude:viewport-fit-sides" content="cover">
<title>نجوم الانضباط والحضور – مدرسة بيت الاكتشاف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7B2FBE; --purple-d:#5B1F94; --purple-l:#EBD9FA;
  --orange:#FF8A3D; --pink:#FF5FA2; --yellow:#FFD93D;
  --ink:#3A2358;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  direction:rtl;
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%,rgba(255,217,61,.45),transparent 40%),
    radial-gradient(circle at 90% 20%,rgba(255,95,162,.40),transparent 45%),
    radial-gradient(circle at 80% 95%,rgba(255,138,61,.40),transparent 45%),
    linear-gradient(160deg,#F3E4FF 0%,#FFE3F0 50%,#FFF1D0 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  position:relative;
}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floater{position:absolute;bottom:-60px;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{
  0%{transform:translateY(0) rotate(0);opacity:0}
  10%{opacity:.85}
  90%{opacity:.85}
  100%{transform:translateY(-115vh) rotate(360deg);opacity:0}
}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}

/* Header */
.logo-wrap{display:flex;justify-content:center;margin-bottom:10px}
.logo-wrap{animation:fadeIn .8s ease}
.logo-wrap img{width:min(280px,72vw);height:auto;display:block;background:#fff;border-radius:26px;padding:10px 14px;border:3px solid var(--yellow);box-shadow:0 10px 28px rgba(123,47,190,.22)}
.logo-fallback{
  display:none;padding:12px 26px;border-radius:50px;
  background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;
  font-weight:800;font-size:1.2rem;box-shadow:0 8px 20px rgba(123,47,190,.3);
}
.title{
  font-family:'Aref Ruqaa','Tajawal',serif;
  font-size:clamp(1.7rem,6vw,2.7rem);line-height:1.5;
  background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin:4px 0 2px;
}
.subtitle{font-weight:700;color:var(--purple-d);font-size:clamp(1rem,3.4vw,1.2rem);margin-bottom:18px}
.title .tw{display:inline-block;animation:twinkle 1.8s ease-in-out infinite;-webkit-text-fill-color:initial}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.3) rotate(15deg)}}

/* Panels */
.panel{
  background:rgba(255,255,255,.92);
  border-radius:30px;padding:26px 20px;
  box-shadow:0 14px 40px rgba(123,47,190,.18);
  border:3px dashed var(--pink);
  position:relative;
}
.panel::before,.panel::after{content:"⭐";position:absolute;font-size:1.6rem;animation:twinkle 2.2s infinite}
.panel::before{top:-16px;right:18px}
.panel::after{content:"💖";top:-16px;left:18px;animation-delay:.6s}
.welcome{font-size:clamp(1.05rem,3.8vw,1.3rem);line-height:2;font-weight:700;color:var(--purple-d);margin-bottom:18px}
.select-wrap{position:relative;max-width:420px;margin:0 auto}
select{
  width:100%;appearance:none;-webkit-appearance:none;
  font:inherit;font-weight:700;font-size:1.15rem;color:var(--purple-d);
  padding:15px 20px 15px 50px;border-radius:50px;
  border:3px solid var(--purple);background:#fff;cursor:pointer;
  box-shadow:0 6px 16px rgba(123,47,190,.15);
}
select:focus{outline:4px solid rgba(255,217,61,.7)}
.select-wrap::after{content:"▼";position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--orange);pointer-events:none;font-size:.9rem}

.big-btn{
  display:none;margin:22px auto 0;
  font:inherit;font-weight:800;font-size:clamp(1.2rem,4.5vw,1.55rem);
  padding:16px 38px;border:none;border-radius:60px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--orange),var(--pink) 55%,var(--purple));
  box-shadow:0 10px 0 #b3367a,0 16px 30px rgba(255,95,162,.45);
  transition:transform .15s, box-shadow .15s;
  animation:pulse 1.6s ease-in-out infinite;
}
.big-btn.show{display:block;animation:pop .5s cubic-bezier(.3,1.6,.5,1),pulse 1.6s .5s ease-in-out infinite}
.big-btn:active{transform:translateY(6px);box-shadow:0 4px 0 #b3367a,0 8px 16px rgba(255,95,162,.4)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

.ghost-btn{
  font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;
  margin-top:22px;padding:12px 28px;border-radius:50px;
  background:#fff;color:var(--purple);border:3px solid var(--purple);
  transition:.2s;
}
.ghost-btn:hover{background:var(--purple);color:#fff}

.stage{display:none}
.stage.active{display:block;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* Envelope */
.hint{font-weight:800;font-size:1.25rem;color:var(--purple-d);margin-bottom:20px}
.hint span{display:inline-block;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.env-holder{padding:70px 0 20px;transition:opacity .6s, transform .6s}
.env-holder.gone{opacity:0;transform:scale(.8) translateY(30px)}
.envelope{
  position:relative;width:min(340px,82vw);aspect-ratio:340/220;margin:0 auto;
  cursor:pointer;perspective:900px;animation:wiggle 2.5s ease-in-out infinite;
  border:none;background:none;display:block;font:inherit;
  -webkit-tap-highlight-color:transparent;
}
.envelope.open{animation:none}
@keyframes wiggle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) scale(1.03)}}
.env-back{position:absolute;inset:0;background:linear-gradient(160deg,#FFB067,var(--orange));border-radius:14px;box-shadow:0 18px 36px rgba(123,47,190,.3)}
.env-card{
  position:absolute;left:7%;right:7%;top:9%;bottom:9%;z-index:1;border-radius:10px;
  background:linear-gradient(#fff,#FFF7DB);border:2px solid var(--yellow);
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  transition:transform .9s cubic-bezier(.3,1.2,.5,1) .55s;
}
.env-front{
  position:absolute;inset:0;z-index:2;border-radius:14px;
  background:linear-gradient(160deg,#FF7BB5,var(--pink));
  clip-path:polygon(0 100%,0 0,50% 56%,100% 0,100% 100%);
}
.env-flap{
  position:absolute;left:0;right:0;top:0;height:56%;z-index:3;
  background:linear-gradient(180deg,var(--purple),#9A4BDB);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;transition:transform .7s ease, background .7s;
}
.env-seal{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;font-size:2.3rem;
  transition:opacity .3s, transform .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));
}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0;background:#B97BEF}
.envelope.open .env-seal{opacity:0;transform:translate(-50%,-50%) scale(2)}
.envelope.open .env-card{transform:translateY(-62%) scale(1.04)}

/* Letter */
.letter{
  background:#fff;border-radius:30px;padding:28px 22px 26px;position:relative;
  border:6px solid transparent;
  background:
    linear-gradient(#fffdf6,#fffdf6) padding-box,
    linear-gradient(135deg,var(--purple),var(--pink),var(--orange),var(--yellow)) border-box;
  box-shadow:0 18px 50px rgba(123,47,190,.28);
  animation:cardIn .9s cubic-bezier(.2,1.3,.4,1);
  text-align:center;
}
@keyframes cardIn{0%{transform:translateY(120px) scale(.4) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.letter .deco{font-size:1.6rem;letter-spacing:6px;animation:twinkle 2s infinite}
.letter h2{
  font-family:'Aref Ruqaa','Tajawal',serif;font-size:clamp(1.5rem,5.4vw,2.1rem);
  color:var(--purple);margin:8px 0 14px;line-height:1.6;
}
.letter h2 b{color:var(--pink)}
.letter p.body{
  font-size:clamp(1.05rem,3.7vw,1.22rem);line-height:2.1;font-weight:500;
  text-align:right;color:var(--ink);margin-bottom:18px;
}
.sign{
  margin-top:8px;padding-top:14px;border-top:3px dotted var(--orange);
  font-weight:800;color:var(--purple-d);line-height:1.9;font-size:1.1rem;
}
.sign .nm{font-family:'Aref Ruqaa','Tajawal',serif;font-size:1.5rem;color:var(--pink);display:block}
.hearts-row{margin-top:10px;font-size:1.3rem}

.foot{margin-top:26px;font-weight:700;color:var(--purple-d);opacity:.85;font-size:.95rem}

@media (prefers-reduced-motion:reduce){
  .floater,.envelope,.big-btn,.panel::before,.panel::after{animation:none!important}
}
@media print{#floaters,#confetti{display:none}}
</style>

  <!-- المرحلة 1: الترحيب واختيار الاسم -->
  <section id="stageWelcome" class="stage active panel">

<script>
(function(){
  /* ---------- الرسائل (لا تُعرض إلا عند اختيار الاسم) ---------- */
  var DATA = {
    shihab:{name:"شهاب", f:false, text:"عزيزي شهاب، اسمك يلمع في سماء مدرستنا، وحضورك المنتظم كل صباح ضوءٌ نفرح به جميعًا. التزامك بالحضور ليس مجرد أرقام في سجل، بل دليل على مسؤوليتك وحبك للتعلّم واحترامك لوقتك ولمعلميك وزملائك. نحن فخورون بك أشدّ الفخر، ونعلم أن من يبدأ يومه بالمواظبة سيصنع في مستقبله إنجازات كبيرة. شكرًا لأنك نجمٌ حاضر دائمًا، وواصل تألقك!"},
    abdullah:{name:"عبدالله", f:false, text:"عزيزي عبدالله، مواظبتك على الحضور تشبه الجبال الثابتة التي لا تهتز: ثباتٌ وهدوءٌ وقوة. كل يوم تأتي فيه إلى مدرستك بحماس هو خطوة جميلة في طريق نجاحك، وقدوةٌ لأصدقائك من حيث لا تدري. نشكرك على التزامك وانضباطك الراقي، ونفخر بأن يكون بيننا طالبٌ يُعتمد عليه ويُحَب. استمر يا بطل، فالمستقبل ينتظر شخصًا مثلك!"},
    nayef:{name:"نايف", f:false, text:"عزيزي نايف، كالصقر الذي يعرف وجهته ويحلّق بثقة، أنت تعرف طريقك إلى المدرسة كل يوم بعزيمة وهمّة عالية. انضباطك والتزامك بالحضور يدلّان على شخصية قوية وطموحٍ كبير. يسعدنا أن نراك دائمًا في مكانك، ويشرّفنا أن نقول: هذا نايف، نجمٌ من نجوم الانضباط. شكرًا لك من القلب، وحلّق عاليًا بإذن الله!"},
    asma:{name:"أسماء", f:true, text:"عزيزتي أسماء، ما أجمل أن تبدأ الصباحات بوجهك المبتسم في الصف! مواظبتك على الحضور تعكس رقيّ أخلاقك وحرصك على التعلّم، وتُشعر كل من حولك بالسعادة والطمأنينة. التزامك رسالة جميلة تقول إن الاجتهاد يبدأ بخطوة صغيرة كل يوم. نحن فخورون بك جدًا، وسعداء بأنك نجمةٌ ثابتة في سماء بيت الاكتشاف. دمتِ متألقة!"},
    talin_m:{name:"تالين محمود", f:true, text:"عزيزتي تالين محمود، أنتِ كنجمة صغيرة لا تغيب؛ حضورك ومواظبتك يضيئان صفّك ويزرعان الفرح في قلوبنا. ما تفعلينه من التزام يوميّ يبدو بسيطًا، لكنه عظيم عند من يعرف قيمته، فهو يصنع عادةً جميلة ستبقى معك طوال العمر. شكرًا لكِ على انضباطك، ونحن نصفّق لكِ بحرارة. أنتِ فخرٌ لنا يا تالين!"},
    talin_w:{name:"تالين وائل", f:true, text:"عزيزتي تالين وائل، الطالبات المميزات يتركن أثرًا هادئًا وجميلًا، وأنتِ كذلك. مواظبتك والتزامك بالحضور يدلّان على نضجٍ ومسؤولية تفوق عمرك الجميل. نشكرك على كل يوم حضرتِ فيه بنشاط وحماس، فقد جعلتِ مدرستنا أجمل بوجودك. استمري على هذا العطاء، فالنجاح يحب من يلتزمون مثلك!"},
    aisha:{name:"عائشة", f:true, text:"عزيزتي عائشة، اسمك يحمل معنى الحياة، وحضورك يملأ الصف حياةً وبهجة! التزامك اليومي بالحضور وحرصك على ألا يفوتك درس يعكسان قلبًا مجتهدًا وإرادة جميلة. نحن نراكِ ونقدّر مواظبتك، ونفخر بكِ أيما فخر. شكرًا لأنكِ نجمةٌ حاضرة في كل صباح، وأكملي مسيرتك المشرقة بكل حب!"},
    lama:{name:"لمى", f:true, text:"عزيزتي لمى، كل صباح تلمعين بحضورك كأنكِ لؤلؤة صغيرة تزيّن مدرستنا. التزامك بالمواظبة وانتظامك في الحضور يعبّران عن حبّك للتعلّم واحترامك لنفسك ولمعلماتك. لقد صرتِ مثالًا جميلًا لزميلاتك وزملائك دون أن تقولي كلمة. شكرًا لكِ من القلب، ونحن فخورون بنجمتنا الرقيقة لمى. تألقي دائمًا!"},
    manana:{name:"منانة", f:true, text:"عزيزتي منانة، حضورك هدية جميلة نفرح بها كل يوم! مواظبتك والتزامك يُظهران قلبًا واعيًا وروحًا مسؤولة، وهذا ما يجعل منكِ طالبةً مميزة ومحبوبة. نعلم أن وراء كل يوم حضرتِه إصرارًا وحبًا، ونحن نقدّره ونشكرك عليه. أنتِ فخرٌ لمدرسة بيت الاكتشاف، فاستمري بنفس الجمال والتألق!"}
  };

  var $ = function(id){return document.getElementById(id)};
  var select=$('nameSelect'), revealBtn=$('revealBtn'), envelope=$('envelope'),
      envHolder=$('envHolder'), mount=$('letterMount');
  var stages={welcome:$('stageWelcome'),envelope:$('stageEnvelope'),letter:$('stageLetter')};
  var timers=[], opened=false;

  function show(name){
    for(var k in stages){stages[k].classList.remove('active')}
    stages[name].classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function clearTimers(){timers.forEach(clearTimeout);timers=[]}

  select.addEventListener('change',function(){
    revealBtn.classList.remove('show');
    void revealBtn.offsetWidth;
    revealBtn.classList.add('show');
  });

  revealBtn.addEventListener('click',function(){
    if(!select.value) return;
    opened=false;
    envelope.classList.remove('open');
    envHolder.classList.remove('gone');
    envHolder.style.display='';
    mount.innerHTML='';
    show('envelope');
  });

  function openEnvelope(){
    if(opened || !select.value) return;
    opened=true;
    var key=select.value;
    envelope.classList.add('open');
    burst(60);
    timers.push(setTimeout(function(){ envHolder.classList.add('gone'); },1900));
    timers.push(setTimeout(function(){
      if(select.value!==key) return;
      envHolder.style.display='none';
      renderLetter(key);
      show('letter');
      burst(160);
      timers.push(setTimeout(function(){burst(90)},700));
    },2500));
  }
  envelope.addEventListener('click',openEnvelope);

  function renderLetter(key){
    var d=DATA[key]; if(!d) return;
    mount.innerHTML='';
    var card=document.createElement('article'); card.className='letter';
    var deco=document.createElement('div'); deco.className='deco'; deco.textContent='⭐ 💖 ⭐ 💖 ⭐';
    var h=document.createElement('h2');
    h.appendChild(document.createTextNode(d.f?'إلى نجمتنا المتألقة ':'إلى نجمنا المتألق '));
    var b=document.createElement('b'); b.textContent=d.name; h.appendChild(b);
    h.appendChild(document.createTextNode(' 🌟'));
    var p=document.createElement('p'); p.className='body'; p.textContent=d.text;
    var s=document.createElement('div'); s.className='sign';
    s.appendChild(document.createTextNode('الموجهة الطلابية'));
    var nm=document.createElement('span'); nm.className='nm'; nm.textContent='ريم الجهني'; s.appendChild(nm);
    var hr=document.createElement('div'); hr.className='hearts-row'; hr.textContent='💜 🧡 💗 💛';
    card.appendChild(deco); card.appendChild(h); card.appendChild(p); card.appendChild(s); card.appendChild(hr);
    mount.appendChild(card);
  }

  /* العودة */
  Array.prototype.forEach.call(document.querySelectorAll('[data-back]'),function(btn){
    btn.addEventListener('click',function(){
      clearTimers(); opened=false;
      mount.innerHTML='';
      envelope.classList.remove('open');
      envHolder.classList.remove('gone'); envHolder.style.display='';
      select.selectedIndex=0;
      revealBtn.classList.remove('show');
      show('welcome');
    });
  });

  /* ---------- نجوم وقلوب متحركة في الخلفية ---------- */
  (function(){
    var box=$('floaters'), icons=['⭐','💖','🌟','💜','🧡','💛','✨','💗'];
    for(var i=0;i<22;i++){
      var s=document.createElement('span'); s.className='floater';
      s.textContent=icons[i%icons.length];
      s.style.left=(Math.random()*100)+'%';
      s.style.fontSize=(16+Math.random()*26)+'px';
      s.style.animationDuration=(9+Math.random()*10)+'s';
      s.style.animationDelay=(-Math.random()*18)+'s';
      box.appendChild(s);
    }
  })();

  /* ---------- كونفيتي احتفالي ---------- */
  var cv=$('confetti'), ctx=cv.getContext('2d'), parts=[], running=false;
  function size(){cv.width=window.innerWidth;cv.height=window.innerHeight}
  size(); window.addEventListener('resize',size);
  var colors=['#7B2FBE','#FF8A3D','#FF5FA2','#FFD93D','#B97BEF'], glyphs=['⭐','💖','✨','💜','🧡','💛'];
  function burst(n){
    for(var i=0;i<n;i++){
      var fromLeft=Math.random()<.5;
      var emoji=Math.random()<.3;
      parts.push({
        x:cv.width*(.5+(Math.random()-.5)*.3), y:cv.height*.4,
        vx:(Math.random()-.5)*16, vy:-Math.random()*14-4,
        g:.32+Math.random()*.15, r:Math.random()*6.28, vr:(Math.random()-.5)*.35,
        s:6+Math.random()*8, c:colors[(Math.random()*colors.length)|0],
        e:emoji?glyphs[(Math.random()*glyphs.length)|0]:null, life:0
      });
    }
    if(!running){running=true;requestAnimationFrame(tick)}
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr; p.life++;
      if(p.y>cv.height+40||p.life>240){parts.splice(i,1);continue}
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0,1-p.life/240);
      if(p.e){ctx.font=(p.s*2.2)+'px serif';ctx.textAlign='center';ctx.fillText(p.e,0,0)}
      else{ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6)}
      ctx.restore();
    }
    if(parts.length){requestAnimationFrame(tick)}else{running=false;ctx.clearRect(0,0,cv.width,cv.height)}
  }
})();
</script>
